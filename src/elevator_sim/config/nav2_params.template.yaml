# Nav2 parameters TEMPLATE, instantiated per robot by launch/sim.launch.py.
# Placeholders: @ROBOT@ @RADIUS@ @X@ @Y@ @YAW@ @VMAX@
# All TF frames are prefixed with the robot name (tb3_1/odom, tb3_1/base_footprint ...)
# and share the global "map" frame + /tf topic, so a single RViz can show both robots.
# Node sections are nested under the robot namespace (@ROBOT@:) so they match the
# namespaced nodes (/tb3_1/amcl ...).
/**:
  ros__parameters:
    use_sim_time: true

@ROBOT@:
  amcl:
    ros__parameters:
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: "@ROBOT@/base_footprint"
      odom_frame_id: "@ROBOT@/odom"
      global_frame_id: "map"
      map_topic: /map
      scan_topic: scan
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3
      do_beamskip: false
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0
      laser_max_range: 3.5
      laser_min_range: -1.0
      laser_model_type: "likelihood_field"
      max_beams: 60
      max_particles: 1000
      min_particles: 300
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      resample_interval: 1
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      save_pose_rate: 0.5
      sigma_hit: 0.2
      tf_broadcast: true
      transform_tolerance: 1.0
      update_min_a: 0.1
      update_min_d: 0.1
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      set_initial_pose: true
      initial_pose: {x: @X@, y: @Y@, z: 0.0, yaw: @YAW@}

  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: "@ROBOT@/base_footprint"
      odom_topic: odom
      bt_loop_duration: 10
      default_server_timeout: 200      # ms; 20 ms default is too short on a loaded CPU
      wait_for_service_timeout: 1000
      action_server_result_timeout: 900.0
      navigators: ["navigate_to_pose", "navigate_through_poses"]
      navigate_to_pose:
        plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      navigate_through_poses:
        plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      error_code_names: [compute_path_error_code, follow_path_error_code]

  controller_server:
    ros__parameters:
      controller_frequency: 10.0
      costmap_update_timeout: 0.30
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      odom_topic: odom
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.3
        movement_time_allowance: 20.0
      general_goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        stateful: true
        xy_goal_tolerance: 0.12
        yaw_goal_tolerance: 0.12
      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: @VMAX@
        lookahead_dist: 0.5
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.8
        lookahead_time: 1.5
        rotate_to_heading_angular_vel: 0.5   # faster in-place turns make the Burger's wheels slip
        transform_tolerance: 0.5
        use_velocity_scaled_lookahead_dist: false
        min_approach_linear_velocity: 0.05
        approach_velocity_scaling_dist: 0.6
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_regulated_linear_velocity_scaling: true
        use_cost_regulated_linear_velocity_scaling: false
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.05
        use_fixed_curvature_lookahead: false
        allow_reversing: false
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.785
        max_angular_accel: 3.2
        max_robot_pose_search_dist: 10.0

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: "@ROBOT@/odom"
        robot_base_frame: "@ROBOT@/base_footprint"
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: @RADIUS@
        transform_tolerance: 0.5
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /@ROBOT@/scan   # absolute: costmap nodes live in <robot>/<costmap> namespace
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 3.5
            raytrace_min_range: 0.0
            obstacle_max_range: 3.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 4.0
          inflation_radius: 0.45
        always_send_full_costmap: true

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: "@ROBOT@/base_footprint"
        robot_radius: @RADIUS@
        resolution: 0.05
        transform_tolerance: 0.5
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_topic: /map
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /@ROBOT@/scan   # absolute: costmap nodes live in <robot>/<costmap> namespace
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 3.5
            raytrace_min_range: 0.0
            obstacle_max_range: 3.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 4.0
          inflation_radius: 0.45
        always_send_full_costmap: true

  planner_server:
    ros__parameters:
      expected_planner_frequency: 5.0
      planner_plugins: ["GridBased"]
      costmap_update_timeout: 1.0
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.3
        use_astar: true
        allow_unknown: false

  behavior_server:
    ros__parameters:
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors::DriveOnHeading"
      wait:
        plugin: "nav2_behaviors::Wait"
      local_frame: "@ROBOT@/odom"
      global_frame: map
      robot_base_frame: "@ROBOT@/base_footprint"
      transform_tolerance: 0.5
      simulate_ahead_time: 1.5
      max_rotational_vel: 0.5
      min_rotational_vel: 0.2
      rotational_acc_lim: 3.2
